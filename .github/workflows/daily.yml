name: Daily list

on:
  schedule:
    - cron: "0 14 * * *" # 10am ET
  workflow_dispatch:

# Never use pull_request_target in this repo — it runs with secrets in the base
# repo context, which is the known way public repos leak credentials.

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    # Only this job writes, and only to history/. The post job stays read-only.
    permissions:
      contents: write
    outputs:
      card: ${{ steps.card.outputs.card }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Every org key config/orgs.json knows about. A missing key is not an
      # error — configuredOrgs() drops the org from the packet silently — so an
      # omission here shows up only as judgment having fewer orgs to choose
      # from, and the no-repeat-yesterday rule then starves it into a dead run.
      # Keep this list in sync with .env.example.
      - run: pnpm generate
        env:
          SP_API_BASE: ${{ secrets.SP_API_BASE }}
          SP_KEY_NHL_LEAGUE: ${{ secrets.SP_KEY_NHL_LEAGUE }}
          SP_KEY_NFL_LEAGUE: ${{ secrets.SP_KEY_NFL_LEAGUE }}
          SP_KEY_NBA_LEAGUE: ${{ secrets.SP_KEY_NBA_LEAGUE }}
          SP_KEY_MLB_LEAGUE: ${{ secrets.SP_KEY_MLB_LEAGUE }}
          SP_KEY_PWR4_LEAGUE: ${{ secrets.SP_KEY_PWR4_LEAGUE }}
          SP_KEY_CREATORS: ${{ secrets.SP_KEY_CREATORS }}
          SP_ANTHROPIC_KEY: ${{ secrets.SP_ANTHROPIC_KEY }}
      # generate exits 0 when judgment finds no feasible list — that is a normal
      # outcome, not a failure, so the job stays green and output/ stays empty.
      # Without this flag the post job's `needs` is satisfied and it fails on a
      # missing artifact instead of being skipped.
      - id: card
        name: Check for a card
        run: |
          set -euo pipefail
          if ls output/*/card.png >/dev/null 2>&1; then
            echo "card=true" >> "$GITHUB_OUTPUT"
          else
            echo "card=false" >> "$GITHUB_OUTPUT"
            echo "No card this run — judgment found no feasible list."
          fi

      - uses: actions/upload-artifact@v4
        if: steps.card.outputs.card == 'true'
        with:
          name: card
          path: output/
          retention-days: 30
          # The card was just confirmed present, so an empty upload here means
          # something moved output/ — fail loudly rather than shipping nothing.
          if-no-files-found: error

      # pnpm install runs husky, which points core.hooksPath at .husky/_, so the
      # commit below fires the pre-commit hook. Install the scanner rather than
      # passing --no-verify: the hook is the only thing standing between a
      # generated artifact and a public repo, and CI is exactly where nobody is
      # watching. Pinned to match the version developers run locally.
      - name: Install gitleaks
        run: |
          set -euo pipefail
          VERSION=8.30.1
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      # Runs after the upload deliberately: if pushing history fails, the card
      # is already safe as an artifact.
      #
      # output/ is gitignored and the runner is destroyed at job end, so without
      # this the novelty history judgment sees in CI is always empty and the
      # scheduled run can re-propose yesterday's list.
      - name: Commit history
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain history/)" ]; then
            echo "No new history — generate found no feasible list."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # generate appends exactly one line per run.
          LINE=$(tail -n 1 history/posts.jsonl)

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --soft origin/main

            # Rebuild from origin and re-append rather than rebasing. Two runs
            # both appending at EOF is a textbook rebase conflict, and the
            # resolution we want is always just "keep both lines".
            rm -f history/posts.jsonl
            git checkout origin/main -- history/posts.jsonl 2>/dev/null || true
            mkdir -p history
            printf '%s\n' "$LINE" >> history/posts.jsonl

            git add history/posts.jsonl
            git commit -m "history: $(date -u +%F) list"
            if git push origin HEAD:main; then exit 0; fi

            echo "Push rejected (attempt $attempt) — refetching."
            sleep 5
          done
          exit 1

  post:
    needs: generate
    # A green generate does not imply a card exists. Skip cleanly on the
    # no-feasible-list days rather than burning the approval gate on a failure.
    if: needs.generate.outputs.card == 'true'
    runs-on: ubuntu-latest
    # Add yourself as a required reviewer on this environment. The job pauses,
    # you open the artifact, look at the card, and approve. Free on public repos
    # and it gives you the human gate without needing to be at your laptop.
    environment: publish
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: card
          path: output/
      - name: Post
        run: |
          DIR=$(ls -d output/*/ | head -1)
          pnpm post "$DIR"
        env:
          DRY_RUN: "false"
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
